name: Bump Search Third-Party Images

on:
  schedule:
    # Runs on the 1st and 15th of each month at 08:00 UTC (~every 2 weeks).
    - cron: '0 8 1,15 * *'
  workflow_dispatch:

concurrency:
  group: bump-third-party-images
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Bump Search third-party images if newer tags exist
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Switch to root context
        uses: ./.github/actions/switch-context
        with:
          context-name: 'root-context'

      - name: Setup host
        uses: ./.github/actions/setup-ubuntu-host
        with:
          python-version: '${{ vars.PYTHON_VERSION }}'

      - name: Install helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }} # exported by switch-context from root-context

      - name: Bump images and open or update the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/dev/switch_context.sh root-context  # re-snapshot PATH so generate_files.sh uses the pinned helm
          PYTHONPATH=. python -m scripts.dev.bump_third_party_images
          # status (not diff) so the new untracked changelog file counts as a change
          if [[ -n "$(git status --porcelain)" ]]; then
            scripts/create-third-party-images-bump-pr.sh
          fi
