# Release process: publishes the images already promoted for a given commit.
#
# The annotation message prefix "[new]... " signals that this tag should be
# processed by the new release-publish pipeline.
name: Release MCK version (publish-only)

permissions:
  contents: read
  checks: read

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full SHA of the commit hash to release'
        type: string
        required: true
      version:
        description: 'Expected release version'
        required: true
        type: string
      dry_run:
        description: "Dry run: post a non release tag"
        type: boolean
        default: false

jobs:
  create_tag_and_draft_release:
    name: Create Draft Release & Push Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'

      - name: Setup host
        uses: ./.github/actions/setup-ubuntu-host
        with:
          python-version: '${{ vars.PYTHON_VERSION }}'

      - name: Validate commit SHA and version
        env:
          COMMIT_SHA: ${{ github.event.inputs.commit_sha }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if ! echo "$COMMIT_SHA" | grep -qP '^[0-9a-f]{40}$'; then
            echo "Error: commit_sha '$COMMIT_SHA' is not a valid 40-character hex SHA"
            exit 1
          fi
          if ! git cat-file -e "$COMMIT_SHA^{commit}" 2>/dev/null; then
            echo "Error: commit_sha '$COMMIT_SHA' does not exist in the repository"
            exit 1
          fi
          RELEASED_VERSION="$(git show "$COMMIT_SHA:release.json" | jq -er '.mongodbOperator')"
          if [ "$RELEASED_VERSION" != "$VERSION" ]; then
            echo "Error: version mismatch for commit $COMMIT_SHA: expected '$VERSION', but release.json has '$RELEASED_VERSION'"
            exit 1
          fi
          echo "Commit SHA $COMMIT_SHA is valid and matches version $VERSION"

      - name: Generate Release Notes
        id: generate_release_notes
        run: python -m scripts.release.release_notes -s $INITIAL_COMMIT_SHA -v $INITIAL_VERSION -o release_notes_final.md
        env:
          INITIAL_COMMIT_SHA: ${{ vars.RELEASE_INITIAL_COMMIT_SHA }}
          INITIAL_VERSION: ${{ vars.RELEASE_INITIAL_VERSION }}

      - name: Create annotated tag and draft release
        env:
          VERSION: ${{ github.event.inputs.version }}
          COMMIT_SHA: ${{ github.event.inputs.commit_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          TAG_NAME="${VERSION}"
          latest_args=(--latest)
          if [[ "$DRY_RUN" == "true" ]]; then
            TAG_NAME="test-$VERSION"
            latest_args=()
          fi
          annotation="[new] Release of MCK $VERSION"
          git tag -a "$TAG_NAME" -m "${annotation}" "$COMMIT_SHA"
          git push origin "$TAG_NAME"
          gh release create "$TAG_NAME" --target "$COMMIT_SHA" --verify-tag --draft "${latest_args[@]}" --notes-file release_notes_final.md --title "Release of MCK $VERSION"

      - name: Show Evergreen links
        env:
          VERSION: ${{ github.event.inputs.version }}
          COMMIT_SHA: ${{ github.event.inputs.commit_sha }}
        run: scripts/release/show_links.sh evergreen | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

  wait_for_evergreen:
    name: Wait for Evergreen
    runs-on: ubuntu-latest
    needs: create_tag_and_draft_release
    environment: ${{ inputs.dry_run && 'dry-run' || 'production' }} # manual gate in production
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'

      - name: Evergreen wait
        run: echo "Evergreen wait complete." # in Dry runs Evergreen does not run and there is no such wait

      - name: Generate RedHat PR Links in Job Summary
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: scripts/release/show_links.sh redhat-prs | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

  publish_release:
    name: Publish Release
    environment: ${{ inputs.dry_run && 'dry-run' || 'production' }} # Manual gate in production
    runs-on: ubuntu-latest
    needs: wait_for_evergreen
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'

      - name: Publish Release Notes
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            gh release edit "test-$VERSION" --draft=true --verify-tag
          else
            gh release edit "$VERSION" --draft=false --verify-tag --latest
          fi
