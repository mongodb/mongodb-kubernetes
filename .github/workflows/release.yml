# Release process: publishes the images already promoted for a given commit.
#
# The annotation message prefix "[new]... " signals that this tag should be
# processed by the new release-publish pipeline.
name: Release MCK version (publish-only)

permissions:
  contents: read
  checks: read

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full SHA of the commit hash to release'
        type: string
        required: true
      version:
        description: 'Expected release version'
        required: true
        type: string
      dry_run:
        description: 'Dry run: do not publish for real'
        required: false
        type: boolean
        default: false

jobs:
  create_tag_and_draft_release:
    name: Create Draft Release & Push Tag
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ github.event.inputs.commit_sha }}
      version: ${{ github.event.inputs.version }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'

      - name: Setup host
        uses: ./.github/actions/setup-ubuntu-host
        with:
          python-version: '${{ vars.PYTHON_VERSION }}'

      - name: Validate commit SHA
        env:
          COMMIT_SHA: ${{ github.event.inputs.commit_sha }}
        run: |
          if ! echo "$COMMIT_SHA" | grep -qP '^[0-9a-f]{40}$'; then
            echo "Error: commit_sha '$COMMIT_SHA' is not a valid 40-character hex SHA"
            exit 1
          fi
          if ! git cat-file -e "$COMMIT_SHA^{commit}" 2>/dev/null; then
            echo "Error: commit_sha '$COMMIT_SHA' does not exist in the repository"
            exit 1
          fi
          echo "Commit SHA $COMMIT_SHA is valid"

      - name: Generate Release Notes
        id: generate_release_notes
        run: python -m scripts.release.release_notes -s $INITIAL_COMMIT_SHA -v $INITIAL_VERSION -o release_notes_final.md
        env:
          INITIAL_COMMIT_SHA: ${{ vars.RELEASE_INITIAL_COMMIT_SHA }}
          INITIAL_VERSION: ${{ vars.RELEASE_INITIAL_VERSION }}

      - name: Generate draft release
        run: |
          release_title="Release of MCK $VERSION"
          if [[ "${DRY_RUN}" == "true" ]]; then
            release_title="[TEST] Release of MCK $VERSION"
          fi
          gh release create "$VERSION" --target "$COMMIT_SHA" --draft --latest --notes-file release_notes_final.md --title "$release_title"
        env:
          VERSION: ${{ github.event.inputs.version }}
          COMMIT_SHA: ${{ github.event.inputs.commit_sha }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create git tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          annotation="[new] Release of MCK $VERSION"
          if [[ "${DRY_RUN}" == "true" ]]; then
            annotation="[new][dry-run] Release of MCK $VERSION"
          fi
          git tag -a "$VERSION" -m "${annotation}" "$COMMIT_SHA"
          git push origin "$VERSION"
        env:
          VERSION: ${{ github.event.inputs.version }}
          COMMIT_SHA: ${{ github.event.inputs.commit_sha }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Evergreen links
        run: |
          echo "## 🔗 Evergreen Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The tag has been pushed. Check Evergreen for the triggered build:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **[Tag-triggered builds (waterfall)](https://spruce.corp.mongodb.com/project/mongodb-kubernetes/waterfall?requesters=git_tag_request)**" >> $GITHUB_STEP_SUMMARY
          echo "- **[All project patches](https://spruce.corp.mongodb.com/project/mongodb-kubernetes/patches)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Once the Evergreen publish pipeline completes successfully, approve the next job to continue." >> $GITHUB_STEP_SUMMARY
          echo "In case you need to kick the patch manually:"
          echo "  evergreen patch -p mongodb-kubernetes -v release_decider_patch \ "
          echo "    -t decide_release_process -d "Release version $VERSION \ "
          echo "    -f -y -u --path .evergreen.yml \ "
          echo "    --param BUILD_SCENARIO=release --param triggered_by_git_tag=${VERSION} \ "
          echo "    --param target_commit=${COMMIT_SHA}"

  wait_for_evergreen_and_prep_pr:
    name: Wait for Evergreen & Synthesize PR Link
    runs-on: ubuntu-latest
    needs: create_tag_and_draft_release
    environment: production # Manual gate: user checks EVG before approving
    permissions:
      contents: read
      checks: read
    steps:
      - name: Show Evergreen links
        run: |
          echo "## 🔗 Evergreen Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Confirm the Evergreen publish pipeline has completed successfully:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **[Tag-triggered builds (waterfall)](https://spruce.corp.mongodb.com/project/mongodb-kubernetes/waterfall?requesters=git_tag_request)**" >> $GITHUB_STEP_SUMMARY
          echo "- **[All project patches](https://spruce.corp.mongodb.com/project/mongodb-kubernetes/patches)**" >> $GITHUB_STEP_SUMMARY

      - name: Generate RedHat PR Links in Job Summary
        run: |
          RH_FORK_ORG="mongodb-forks"
          COMMUNITY_REPO="community-operators"
          CERTIFIED_REPO="certified-operators"
          VERSION="${{ needs.create_tag_and_draft_release.outputs.version }}"
          RH_BRANCH="mongodb-kubernetes-${VERSION}"

          COMMUNITY_PR_CREATION_URL="https://github.com/k8s-operatorhub/community-operators/compare/main...${RH_FORK_ORG}:${COMMUNITY_REPO}:${RH_BRANCH}?quick_pull=1"
          CERTIFIED_PR_CREATION_URL="https://github.com/redhat-openshift-ecosystem/certified-operators/compare/main...${RH_FORK_ORG}:${CERTIFIED_REPO}:${RH_BRANCH}?quick_pull=1"
          echo "## 🚀 Evergreen Finished: RedHat PR Ready" >> $GITHUB_STEP_SUMMARY
          echo "Evergreen successfully created the release branches on the RedHat fork." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 **[Click here to create the RedHat Community Operators PR](${COMMUNITY_PR_CREATION_URL})**" >> $GITHUB_STEP_SUMMARY
          echo "👉 **[Click here to create the RedHat Certified Operators PR](${CERTIFIED_PR_CREATION_URL})**" >> $GITHUB_STEP_SUMMARY

  publish_release:
    name: Publish Release
    if: ${{ github.event.inputs.dry_run != 'true' }} # Hard stop: never publish on dry runs
    environment: production # Manual gate
    runs-on: ubuntu-latest
    needs: wait_for_evergreen_and_prep_pr
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'

      - name: Publish Release Notes
        run: |
          gh release edit $VERSION --draft=false --verify-tag --latest
        env:
          VERSION: ${{ needs.create_tag_and_draft_release.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
