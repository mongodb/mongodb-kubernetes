name: Conditional review requirement

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

concurrency:
  group: conditional-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conditional-review:
    name: Conditional review requirement
    if: github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Evaluate review requirement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail

          # shellcheck disable=SC2016 # GraphQL variables, not shell expansions
          pr_json="$(gh api graphql \
            -f owner="${GITHUB_REPOSITORY%/*}" \
            -f name="${GITHUB_REPOSITORY#*/}" \
            -F number="${PR_NUMBER}" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    author { login }
                    labels(first: 100) { nodes { name } }
                    latestReviews(first: 100) {
                      nodes { state author { login __typename } authorAssociation }
                    }
                  }
                }
              }')"

          if ! jq -e '.data.repository.pullRequest.labels.nodes | map(.name | ascii_downcase) | index("needs-extra-review")' <<<"${pr_json}" > /dev/null; then
            echo "needs-extra-review is not set; the default one-approval rule applies." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          author="$(jq -r '.data.repository.pullRequest.author.login // "" | ascii_downcase' <<<"${pr_json}")"
          approvals="$(jq --arg author "${author}" '
            [.data.repository.pullRequest.latestReviews.nodes[]
             | select(.state == "APPROVED")
             | select(.author.__typename == "User")
             | select((.authorAssociation // "") | IN("MEMBER", "OWNER", "COLLABORATOR"))
             | select(((.author.login // "") | ascii_downcase) != $author)]
            | length' <<<"${pr_json}")"

          if [ "${approvals}" -ge 2 ]; then
            echo "${approvals} distinct reviewers approved; 2 required." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          echo "::error::${approvals} of 2 distinct reviewer approvals."
          echo "${approvals} of 2 distinct reviewer approvals." >> "${GITHUB_STEP_SUMMARY}"
          exit 1
