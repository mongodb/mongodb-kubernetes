---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mck-member-sa
  namespace: mongodb
  annotations:
    mongodb.com/rbac-version: "2.0.0"
---
# Long-lived token for the member ServiceAccount. Since Kubernetes 1.24 these are no
# longer auto-created, so we create one explicitly for the operator to authenticate with.
apiVersion: v1
kind: Secret
metadata:
  name: mck-member-token
  namespace: mongodb
  annotations:
    kubernetes.io/service-account.name: mck-member-sa
    mongodb.com/rbac-version: "2.0.0"
type: kubernetes.io/service-account-token
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: mck-member-role-multicluster
  annotations:
    mongodb.com/rbac-version: "2.0.0"
rules:
  # deletecollection is required only for multi-cluster operation: owner references
  # don't work across clusters, so removing a multi-cluster workload (or a whole member
  # cluster) deletes its resources via DeleteAllOf. Single-cluster deletion relies on
  # Kubernetes garbage collection instead, so the base installation role doesn't grant
  # this verb on these resources.
  - apiGroups:
      - ''
    resources:
      - secrets
      - configmaps
      - services
    verbs:
      - deletecollection
  - apiGroups:
      - apps
    resources:
      - statefulsets
      - deployments
    verbs:
      - deletecollection
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: mck-member-role-multicluster-binding
  annotations:
    mongodb.com/rbac-version: "2.0.0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mck-member-role-multicluster
subjects:
  - kind: ServiceAccount
    name: mck-member-sa
    namespace: mongodb
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: mck-member-role-base
  annotations:
    mongodb.com/rbac-version: "2.0.0"
rules:
  - apiGroups:
      - ''
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
  - apiGroups:
      - ''
    resources:
      - secrets
      - configmaps
    verbs:
      - get
      - list
      - create
      - update
      - delete
      - watch
  - apiGroups:
      - apps
    resources:
      - statefulsets
      - deployments
    verbs:
      - create
      - get
      - list
      - watch
      - delete
      - update
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - delete
      - deletecollection

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: mck-member-role-base-binding
  
  annotations:
    mongodb.com/rbac-version: "2.0.0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mck-member-role-base
subjects:
  - kind: ServiceAccount
    name: mck-member-sa
    namespace: mongodb
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: mck-member-pvc-resize
  annotations:
    mongodb.com/rbac-version: "2.0.0"
rules:
  - apiGroups:
      - ''
    resources:
      - persistentvolumeclaims
    verbs:
      - list
      - watch
      - update

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: mck-member-pvc-resize-binding
  
  annotations:
    mongodb.com/rbac-version: "2.0.0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mck-member-pvc-resize
subjects:
  - kind: ServiceAccount
    name: mck-member-sa
    namespace: mongodb
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mck-member-appdb
  namespace: mongodb
  annotations:
    mongodb.com/rbac-version: "2.0.0"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mck-member-database-pods
  namespace: mongodb
  annotations:
    mongodb.com/rbac-version: "2.0.0"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mck-member-ops-manager
  namespace: mongodb
  annotations:
    mongodb.com/rbac-version: "2.0.0"

---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: mck-member-appdb
  namespace: mongodb
  annotations:
    mongodb.com/rbac-version: "2.0.0"
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - patch
      - delete
      - get

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: mck-member-appdb
  namespace: mongodb
  annotations:
    mongodb.com/rbac-version: "2.0.0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mck-member-appdb
subjects:
  - kind: ServiceAccount
    name: mck-member-appdb
    namespace: mongodb
---
# Additional ClusterRole for clusterVersionDetection
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: mck-member-cluster-telemetry
  annotations:
    mongodb.com/rbac-version: "2.0.0"
rules:
  # Non-resource URL permissions
  - nonResourceURLs:
      - "/version"
    verbs:
      - get
  # Cluster-scoped resource permissions
  - apiGroups:
      - ''
    resources:
      - namespaces
    resourceNames:
      - kube-system
    verbs:
      - get
  - apiGroups:
      - ''
    resources:
      - nodes
    verbs:
      - list
---
# ClusterRoleBinding for clusterVersionDetection
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: mck-member-cluster-telemetry-binding
  annotations:
    mongodb.com/rbac-version: "2.0.0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mck-member-cluster-telemetry
subjects:
  - kind: ServiceAccount
    name: mck-member-sa
    namespace: mongodb
