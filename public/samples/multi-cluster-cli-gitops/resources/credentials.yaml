# Member-cluster credentials. The multi-cluster CLI does not render these — users
# provision them themselves and pass the ServiceAccount name to both CLI commands via
# --member-cluster-service-account. The registration command discovers the token Secret
# via the kubernetes.io/service-account.name annotation.
# Set the namespace to the one used as --member-cluster-namespace on your clusters.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mck-member-sa
  namespace: mongodb
---
# Long-lived token for the member ServiceAccount. Since Kubernetes 1.24 these are no
# longer auto-created, so we create one explicitly for the operator to authenticate with.
apiVersion: v1
kind: Secret
metadata:
  name: mck-member-token
  namespace: mongodb
  annotations:
    kubernetes.io/service-account.name: mck-member-sa
type: kubernetes.io/service-account-token
