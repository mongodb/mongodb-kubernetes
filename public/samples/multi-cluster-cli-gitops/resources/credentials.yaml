# Member-cluster credentials. The multi-cluster CLI renders these by default (as part of
# generate-member-resources); this sample pre-provisions them instead — the GitOps flow —
# and passes the ServiceAccount name to both CLI commands via
# --member-cluster-service-account (so the RBAC render skips the credentials and binds to
# this ServiceAccount). The registration command discovers the token Secret via the
# kubernetes.io/service-account.name annotation.
# Set the namespace to the one used as --member-cluster-namespace on your clusters.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mck-member-sa
  namespace: mongodb
---
# Long-lived token for the member ServiceAccount. Since Kubernetes 1.24 these are no
# longer auto-created, so we create one explicitly for the operator to authenticate with.
apiVersion: v1
kind: Secret
metadata:
  name: mck-member-token
  namespace: mongodb
  annotations:
    kubernetes.io/service-account.name: mck-member-sa
type: kubernetes.io/service-account-token
