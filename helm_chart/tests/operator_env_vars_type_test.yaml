suite: Environment Variable Quoting Check
templates:
  - operator.yaml
tests:
  - it: should correctly quote the value for the env vars for container images
    set:
      initDatabase.version: 1234
      database.version: 12d3f4
      initOpsManager.version: 1.2.3
    asserts:      
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INIT_DATABASE_VERSION
            value: "1234"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_VERSION
            value: "12d3f4"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INIT_OPS_MANAGER_VERSION
            value: "1.2.3"
  - it: should correctly quote the value for the env vars for container images even when they are passed quoted
    set:
      initDatabase.version: "1234"
      database.version: "12d3f4"
      initOpsManager.version: "1.2.3"
    asserts:      
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INIT_DATABASE_VERSION
            value: "1234"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_VERSION
            value: "12d3f4"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INIT_OPS_MANAGER_VERSION
            value: "1.2.3"
  - it: should pass the mongodb-proxy image with its version and add the related image of that version
    set:
      registry.mongodbProxy: registry.example.com/mongodb
      mongodbProxy.name: proxy
      mongodbProxy.version: 1.2.3
      relatedImages.agent: []
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MDB_MONGODB_PROXY_IMAGE
            value: "registry.example.com/mongodb/proxy:1.2.3"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RELATED_IMAGE_MDB_MONGODB_PROXY_IMAGE_1_2_3
            value: "registry.example.com/mongodb/proxy:1.2.3"
