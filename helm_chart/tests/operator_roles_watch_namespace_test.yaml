suite: Operator RBAC follows the watch namespaces
templates:
  - operator-roles-base.yaml
tests:
  - it: single namespace -> Role and RoleBinding in the operator namespace
    set:
      operator.createOperatorServiceAccount: true
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Role
        documentIndex: 0
      - equal:
          path: metadata.name
          value: mongodb-kubernetes-operator
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: NAMESPACE
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - secrets
              - configmaps
            verbs:
              - get
              - list
              - create
              - update
              - delete
              - watch
        documentIndex: 0
      # The namespaces rule belongs to the ClusterRole: a namespaced operator does not list namespaces.
      - notContains:
          path: rules
          content:
            resources:
              - namespaces
        documentIndex: 0
      - isKind:
          of: RoleBinding
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: NAMESPACE
        documentIndex: 1
      - equal:
          path: roleRef.kind
          value: Role
        documentIndex: 1
      - equal:
          path: subjects[0].namespace
          value: NAMESPACE
        documentIndex: 1

  - it: multiple namespaces -> ClusterRole and a RoleBinding in every watched namespace and in the operator namespace
    set:
      operator.createOperatorServiceAccount: true
      operator.watchNamespace: "ns1,ns2"
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - equal:
          path: metadata.name
          value: mongodb-kubernetes-operator
        documentIndex: 0
      - notExists:
          path: metadata.namespace
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - namespaces
            verbs:
              - list
              - watch
        documentIndex: 0
      - isKind:
          of: RoleBinding
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: ns1
        documentIndex: 1
      - equal:
          path: roleRef.kind
          value: ClusterRole
        documentIndex: 1
      - equal:
          path: subjects[0].namespace
          value: NAMESPACE
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: ns2
        documentIndex: 2
      # The operator namespace is always watched as well.
      - equal:
          path: metadata.namespace
          value: NAMESPACE
        documentIndex: 3

  - it: all namespaces -> ClusterRole and ClusterRoleBinding, plus a RoleBinding in the operator namespace
    set:
      operator.createOperatorServiceAccount: true
      operator.watchNamespace: "*"
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - equal:
          path: metadata.name
          value: mongodb-kubernetes-operator
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - namespaces
            verbs:
              - list
              - watch
        documentIndex: 0
      - isKind:
          of: ClusterRoleBinding
        documentIndex: 1
      - equal:
          path: metadata.name
          value: mongodb-kubernetes-operator
        documentIndex: 1
      - notExists:
          path: metadata.namespace
        documentIndex: 1
      - equal:
          path: roleRef.kind
          value: ClusterRole
        documentIndex: 1
      - equal:
          path: subjects[0].namespace
          value: NAMESPACE
        documentIndex: 1
      # The operator namespace is always in the watch list, so it also gets its own binding.
      - isKind:
          of: RoleBinding
        documentIndex: 2
      - equal:
          path: metadata.namespace
          value: NAMESPACE
        documentIndex: 2
      - equal:
          path: roleRef.kind
          value: ClusterRole
        documentIndex: 2
