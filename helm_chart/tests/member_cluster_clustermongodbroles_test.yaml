suite: test member-cluster ClusterMongoDBRole RBAC (memberCluster.clusterMongoDBRole)
templates:
  - operator-roles-clustermongodbroles.yaml
tests:
  - it: not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: not rendered in member mode without memberCluster.clusterMongoDBRole
    set:
      memberCluster.enabled: true
      memberCluster.name: my_cluster_1
    asserts:
      - hasDocuments:
          count: 0

  - it: rendered in member mode with memberCluster.clusterMongoDBRole
    set:
      memberCluster.enabled: true
      memberCluster.name: my_cluster_1
      memberCluster.clusterMongoDBRole: true
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - equal:
          path: metadata.name
          value: mck-member-cluster-mongodb-role
        documentIndex: 0
      - equal:
          path: rules[0].apiGroups[0]
          value: mongodb.com
        documentIndex: 0
      - equal:
          path: rules[0].resources[0]
          value: clustermongodbroles
        documentIndex: 0
      - equal:
          path: rules[0].verbs[0]
          value: '*'
        documentIndex: 0
      - isNotEmpty:
          path: metadata.annotations["mongodb.com/rbac-version"]
        documentIndex: 0
      - isKind:
          of: ClusterRoleBinding
        documentIndex: 1
      - equal:
          path: metadata.name
          value: mck-member-cluster-mongodb-role-binding
        documentIndex: 1
      - equal:
          path: roleRef.name
          value: mck-member-cluster-mongodb-role
        documentIndex: 1
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
        documentIndex: 1
      - equal:
          path: subjects[0].name
          value: mck-member-sa
        documentIndex: 1
      - equal:
          path: subjects[0].namespace
          value: NAMESPACE
        documentIndex: 1
      - isNotEmpty:
          path: metadata.annotations["mongodb.com/rbac-version"]
        documentIndex: 1

  - it: honours the operator namespace override
    set:
      memberCluster.enabled: true
      memberCluster.clusterMongoDBRole: true
      operator.namespace: custom-ns
    asserts:
      - equal:
          path: subjects[0].namespace
          value: custom-ns
        documentIndex: 1
