suite: test member-cluster identity ConfigMap (memberCluster.enabled)
templates:
  - member-cluster-identity.yaml
tests:
  - it: not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: rendered in member mode with the logical cluster name
    set:
      memberCluster.enabled: true
      memberCluster.name: my_cluster_1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
        documentIndex: 0
      - equal:
          path: metadata.name
          value: mck-member-cluster
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: NAMESPACE
        documentIndex: 0
      # the logical name is used as-is, even when not RFC 1123
      - equal:
          path: data.clusterName
          value: my_cluster_1
        documentIndex: 0
      - isNotEmpty:
          path: metadata.annotations["mongodb.com/rbac-version"]
        documentIndex: 0

  - it: honours the operator namespace override
    set:
      memberCluster.enabled: true
      memberCluster.name: cluster-east
      operator.namespace: custom-ns
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-ns
        documentIndex: 0
