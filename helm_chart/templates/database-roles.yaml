{{- $memberMode := (.Values.memberCluster | default dict).enabled | default false -}}
{{- $namePrefix := "mongodb-kubernetes" -}}
{{- if $memberMode }}
{{- $namePrefix = printf "mck-member-%s" (required "memberCluster.name is required when memberCluster.enabled is true" .Values.memberCluster.name) -}}
{{- end }}
{{- $rbacVersion := .Chart.Version | quote -}}

{{- $watchNamespace := include "mongodb-kubernetes-operator.namespace" . | list }}
{{- if .Values.operator.watchNamespace }}
{{- $watchNamespace = regexSplit "," .Values.operator.watchNamespace -1 }}
{{- end }}


{{- range $idx, $namespace := $watchNamespace }}

{{- $namespaceBlock := printf "namespace: %s" $namespace }}
{{- if eq $namespace "*" }}
{{- $namespaceBlock = include "mongodb-kubernetes-operator.namespace" $ | printf "namespace: %s"  }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $namePrefix }}-appdb
  {{ $namespaceBlock }}
{{- if $memberMode }}
  annotations:
    mongodb.com/rbac-version: {{ $rbacVersion }}
{{- end }}
{{- if $.Values.registry.imagePullSecrets}}
imagePullSecrets:
  - name: {{ $.Values.registry.imagePullSecrets }}
{{- end }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $namePrefix }}-database-pods
  {{ $namespaceBlock }}
{{- if $memberMode }}
  annotations:
    mongodb.com/rbac-version: {{ $rbacVersion }}
{{- end }}
{{- if $.Values.registry.imagePullSecrets}}
imagePullSecrets:
  - name: {{ $.Values.registry.imagePullSecrets }}
{{- end }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $namePrefix }}-ops-manager
  {{ $namespaceBlock }}
{{- if $memberMode }}
  annotations:
    mongodb.com/rbac-version: {{ $rbacVersion }}
{{- end }}
{{- if $.Values.registry.imagePullSecrets}}
imagePullSecrets:
  - name: {{ $.Values.registry.imagePullSecrets }}
{{- end }}

---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $namePrefix }}-appdb
  {{ $namespaceBlock }}
{{- if $memberMode }}
  annotations:
    mongodb.com/rbac-version: {{ $rbacVersion }}
{{- end }}
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - patch
      - delete
      - get

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $namePrefix }}-appdb
  {{ $namespaceBlock }}
{{- if $memberMode }}
  annotations:
    mongodb.com/rbac-version: {{ $rbacVersion }}
{{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $namePrefix }}-appdb
subjects:
  - kind: ServiceAccount
    name: {{ $namePrefix }}-appdb
    {{ $namespaceBlock }}

{{- end }}
