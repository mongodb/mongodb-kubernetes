{{- $memberCluster := .Values.memberCluster | default dict -}}
{{- $memberMode := $memberCluster.enabled | default false -}}
{{- $operatorNamespace := include "mongodb-kubernetes-operator.namespace" . -}}

{{- $namePrefix := "mongodb-kubernetes" -}}
{{- if $memberMode }}
    {{- $namePrefix = "mck-member" -}}
{{- end }}

{{- $watchNamespace := include "mongodb-kubernetes-operator.namespace" . | list }}
{{- if $memberMode }}
    {{- /* Member mode (generate-member-resources): workload RBAC is seeded exactly in
           memberCluster.workloadNamespaces. "*" is rejected — cluster-wide operators
           use memberCluster.clusterScoped, which covers operator permissions;
           workload ServiceAccounts are always namespaced. */}}
    {{- $watchNamespace = $memberCluster.workloadNamespaces | default $watchNamespace }}
{{- else if .Values.operator.watchNamespace }}
    {{- $watchNamespace = regexSplit "," .Values.operator.watchNamespace -1 }}
{{- end }}

{{- range $idx, $namespace := $watchNamespace }}
{{- if eq $namespace "*" }}
    {{- /* A cluster-wide operator ("*") still seeds the workload ServiceAccounts in
           the operator namespace — they are namespaced objects. */}}
    {{- $namespace = $operatorNamespace }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $namePrefix }}-appdb
  namespace: {{ $namespace }}
  annotations:
    mongodb.com/rbac-version: {{ $.Chart.Version | quote }}
{{- if $.Values.registry.imagePullSecrets}}
imagePullSecrets:
  - name: {{ $.Values.registry.imagePullSecrets }}
{{- end }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $namePrefix }}-database-pods
  namespace: {{ $namespace }}
  annotations:
    mongodb.com/rbac-version: {{ $.Chart.Version | quote }}
{{- if $.Values.registry.imagePullSecrets}}
imagePullSecrets:
  - name: {{ $.Values.registry.imagePullSecrets }}
{{- end }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $namePrefix }}-ops-manager
  namespace: {{ $namespace }}
  annotations:
    mongodb.com/rbac-version: {{ $.Chart.Version | quote }}
{{- if $.Values.registry.imagePullSecrets}}
imagePullSecrets:
  - name: {{ $.Values.registry.imagePullSecrets }}
{{- end }}

---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $namePrefix }}-appdb
  namespace: {{ $namespace }}
  annotations:
    mongodb.com/rbac-version: {{ $.Chart.Version | quote }}
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - patch
      - delete
      - get

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $namePrefix }}-appdb
  namespace: {{ $namespace }}
  annotations:
    mongodb.com/rbac-version: {{ $.Chart.Version | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $namePrefix }}-appdb
subjects:
  - kind: ServiceAccount
    name: {{ $namePrefix }}-appdb
    namespace: {{ $namespace }}

{{- end }}
