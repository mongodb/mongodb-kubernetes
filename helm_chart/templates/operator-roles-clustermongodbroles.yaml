{{- /*
Member-cluster RBAC for ClusterMongoDBRole resources.

Rendered only when `memberCluster.enabled=true` (set exclusively by the
kubectl plugin) and `memberCluster.clusterMongoDBRole` is true.
*/ -}}

{{- $memberCluster := .Values.memberCluster | default dict -}}
{{- $memberMode := $memberCluster.enabled | default false -}}

{{- if and $memberMode $memberCluster.clusterMongoDBRole }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: mck-member-cluster-mongodb-role
  annotations:
    mongodb.com/rbac-version: {{ $.Chart.Version | quote }}
rules:
  - apiGroups:
      - mongodb.com
    verbs:
      - '*'
    resources:
      - clustermongodbroles
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: mck-member-cluster-mongodb-role-binding
  annotations:
    mongodb.com/rbac-version: {{ $.Chart.Version | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mck-member-cluster-mongodb-role
subjects:
  - kind: ServiceAccount
    name: mck-member-sa
    namespace: {{ include "mongodb-kubernetes-operator.namespace" . }}
{{- end }}
