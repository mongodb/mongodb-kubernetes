{{- /*
Member-cluster credentials and multi-cluster-only RBAC.

Rendered only when `memberCluster.enabled=true`, which is set exclusively by
`kubectl mongodb multicluster generate-member-resources` (never by helm install / OLM).
These resources are additive to the base installation RBAC and use a distinct, unified
naming convention (`mck-member-*`, identical on every member cluster) so they never
collide with the base `operator.name` resources — including when the operator's own
cluster is also configured as a member cluster.

This file renders only what is member-specific:

  - the member ServiceAccount and its token Secret (the credentials the operator
    authenticates with);
  - mck-member-role-multicluster: the rules the operator needs ONLY because of
    multi-cluster operation (see the rule comments below).

Everything else the member cluster needs is rendered by the dual-mode templates, which
share one source with the base installation: the operator's shared workload-management
rules in operator-roles-base.yaml (mck-member-role-base), the operator's
PVC-resize rules in operator-roles-pvc-resize.yaml, telemetry in
operator-roles-telemetry.yaml, and the workload pods' RBAC (MongoDB, Ops Manager) in
database-roles.yaml.

The naming prefix is deliberately decoupled from `.Values.operator.name` (which still
differs between single- and multi-cluster installs pending operator-name unification)
and from the MemberCluster CR's metadata.name: member-side RBAC names are the fixed
`mck-member-*` set on every member cluster. The mongodb.com/rbac-version annotation on
them (including the well-known `mck-member-sa` ServiceAccount) is rendered so RBAC
validation can be reintroduced later without re-annotating.

memberCluster.* is intentionally absent from values.yaml — it is a plugin-internal render
flag, not a user-facing install option, so guard the access with `default dict`.

Scope model (set exclusively by the plugin):
  - memberCluster.clusterScoped (bool): the operator watches all namespaces; the member
    ServiceAccount gets ClusterRoles and single ClusterRoleBindings instead of
    per-namespace Roles and RoleBindings.
  - memberCluster.workloadNamespaces (list): namespaces where workloads run on the member
    cluster; in narrowed mode the member ServiceAccount is bound in each of them plus the
    operator namespace (which holds the SA and the token Secret), with one Role per
    namespace — narrowed renders contain no cluster-scoped resources. "*" is never a
    valid entry — cluster-wide permission is expressed only via clusterScoped.
*/ -}}
{{- if (.Values.memberCluster | default dict).enabled }}
{{- $name := "mck-member" }}
{{- $namespace := include "mongodb-kubernetes-operator.namespace" . }}
{{- $memberCluster := .Values.memberCluster | default dict }}
{{- $clusterScoped := $memberCluster.clusterScoped | default false }}
{{- $workloadNamespaces := $memberCluster.workloadNamespaces | default ($namespace | list) }}
{{- if has "*" $workloadNamespaces }}
{{- fail "'*' is not a valid workload namespace; use --operator-cluster-scoped for cluster-wide permissions" }}
{{- end }}
{{- $bindingNamespaces := concat $workloadNamespaces ($namespace | list) | uniq }}
{{- /* Narrowed mode renders one Role per binding namespace (a RoleBinding cannot
       reference a Role in another namespace; MCK 1.x plugin parity); only
       clusterScoped renders a ClusterRole + a single ClusterRoleBinding. */ -}}
{{- $roleNamespaces := $bindingNamespaces -}}
{{- if $clusterScoped }}
{{- $roleNamespaces = list "*" }}
{{- end }}
{{- $rbacVersion := .Chart.Version | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-sa
  namespace: {{ $namespace }}
  annotations:
    mongodb.com/rbac-version: {{ $rbacVersion }}
---
# Long-lived token for the member ServiceAccount. Since Kubernetes 1.24 these are no
# longer auto-created, so we create one explicitly for the operator to authenticate with.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-token
  namespace: {{ $namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ $name }}-sa
    mongodb.com/rbac-version: {{ $rbacVersion }}
type: kubernetes.io/service-account-token
{{- range $idx, $ns := $roleNamespaces }}
{{- $roleScope := "Role" -}}
{{- if eq $ns "*" }}
{{- $roleScope = "ClusterRole" }}
{{- end }}
---
kind: {{ $roleScope }}
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $name }}-role-multicluster
{{- if eq $roleScope "Role" }}
  namespace: {{ $ns }}
{{- end }}
  annotations:
    mongodb.com/rbac-version: {{ $rbacVersion }}
rules:
  # deletecollection is required only for multi-cluster operation: owner references
  # don't work across clusters, so removing a multi-cluster workload (or a whole member
  # cluster) deletes its resources via DeleteAllOf. Single-cluster deletion relies on
  # Kubernetes garbage collection instead, so the base installation role doesn't grant
  # this verb on these resources.
  - apiGroups:
      - ''
    resources:
      - secrets
      - configmaps
      - services
    verbs:
      - deletecollection
  - apiGroups:
      - apps
    resources:
      - statefulsets
      - deployments
    verbs:
      - deletecollection
{{- end }}
{{- range $idx, $ns := $roleNamespaces }}
{{- $bindingKind := "RoleBinding" -}}
{{- $roleRefKind := "Role" -}}
{{- if eq $ns "*" }}
{{- $bindingKind = "ClusterRoleBinding" }}
{{- $roleRefKind = "ClusterRole" }}
{{- end }}
---
kind: {{ $bindingKind }}
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $name }}-role-multicluster-binding
{{- if ne $ns "*" }}
  namespace: {{ $ns }}
{{- end }}
  annotations:
    mongodb.com/rbac-version: {{ $rbacVersion }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $roleRefKind }}
  name: {{ $name }}-role-multicluster
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-sa
    namespace: {{ $namespace }}
{{- end }}
{{- end }}
