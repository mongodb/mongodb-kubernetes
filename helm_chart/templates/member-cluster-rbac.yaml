{{- /*
Member-cluster RBAC for multi-cluster configuration.

Rendered only when `memberCluster.enabled=true`, which is set exclusively by
`kubectl mongodb multicluster generate-member-resources` (never by helm install / OLM).
These resources are additive to the base installation RBAC and use a distinct,
cluster-name-scoped naming convention (`mck-member-<cluster-name>-*`) so they never collide
with the base `operator.name` resources — including when the operator's own cluster
is also configured as a member cluster.

The naming prefix is deliberately decoupled from `.Values.operator.name` (which still
differs between single- and multi-cluster installs pending operator-name unification):
the operator reconstructs the ServiceAccount name `mck-member-<cluster-name>-sa` from the
MemberCluster CR's metadata.name (the same value passed here as memberCluster.name) when
validating RBAC.

memberCluster.* is intentionally absent from values.yaml — it is a plugin-internal render
flag, not a user-facing install option, so guard the access with `default dict`.

Scope model (set exclusively by the plugin):
  - memberCluster.clusterScoped (bool): the operator watches all namespaces; the member
    ServiceAccount gets a ClusterRole and a single ClusterRoleBinding instead of
    per-namespace RoleBindings.
  - memberCluster.workloadNamespaces (list): namespaces where workloads run on the member
    cluster; in narrowed mode the member ServiceAccount is bound in each of them plus the
    operator namespace (which holds the SA and the token Secret). "*" is never a valid
    entry — cluster-wide permission is expressed only via clusterScoped.
*/ -}}
{{- if (.Values.memberCluster | default dict).enabled }}
{{- $name := printf "mck-member-%s" (required "memberCluster.name is required when memberCluster.enabled=true" .Values.memberCluster.name) }}
{{- $namespace := include "mongodb-kubernetes-operator.namespace" . }}
{{- $memberCluster := .Values.memberCluster | default dict }}
{{- $clusterScoped := $memberCluster.clusterScoped | default false }}
{{- $workloadNamespaces := $memberCluster.workloadNamespaces | default ($namespace | list) }}
{{- if has "*" $workloadNamespaces }}
{{- fail "'*' is not a valid workload namespace; use --cluster-scoped for cluster-wide permissions" }}
{{- end }}
{{- $bindingNamespaces := concat $workloadNamespaces ($namespace | list) | uniq }}
{{- $roleScope := "Role" -}}
{{- if or $clusterScoped (gt (len $bindingNamespaces) 1) }}
{{- $roleScope = "ClusterRole" }}
{{- end }}
{{- $rbacVersion := .Chart.Version | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-sa
  namespace: {{ $namespace }}
  annotations:
    mongodb.com/rbac-version: {{ $rbacVersion }}
---
# Long-lived token for the member ServiceAccount. Since Kubernetes 1.24 these are no
# longer auto-created, so we create one explicitly for the operator to authenticate with.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-token
  namespace: {{ $namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ $name }}-sa
    mongodb.com/rbac-version: {{ $rbacVersion }}
type: kubernetes.io/service-account-token
---
kind: {{ $roleScope }}
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $name }}-role
{{- if eq $roleScope "Role" }}
  namespace: {{ $namespace }}
{{- end }}
  annotations:
    mongodb.com/rbac-version: {{ $rbacVersion }}
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
      - configmaps
      - services
    verbs:
      - get
      - list
      - create
      - update
      - delete
      - watch
      - deletecollection
  - apiGroups:
      - apps
    resources:
      - statefulsets
      - deployments
    verbs:
      - get
      - list
      - create
      - update
      - delete
      - watch
      - deletecollection
  - apiGroups:
      - ''
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - create
      - update
      - watch
      - patch
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - delete
      - deletecollection
  # get on serviceaccounts lets the operator read the mck-member-<cluster-name>-sa
  # mongodb.com/rbac-version annotation to validate this cluster's RBAC.
  - apiGroups:
      - ''
    resources:
      - serviceaccounts
    verbs:
      - get
{{- if $clusterScoped }}
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $name }}-role-binding
  annotations:
    mongodb.com/rbac-version: {{ $rbacVersion }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-role
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-sa
    namespace: {{ $namespace }}
{{- else }}
{{- range $idx, $ns := $bindingNamespaces }}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $name }}-role-binding
  namespace: {{ $ns }}
  annotations:
    mongodb.com/rbac-version: {{ $rbacVersion }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $roleScope }}
  name: {{ $name }}-role
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-sa
    namespace: {{ $namespace }}
{{- end }}
{{- end }}
{{- end }}
