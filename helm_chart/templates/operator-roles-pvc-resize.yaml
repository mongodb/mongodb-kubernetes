{{- /*
PVC-resize RBAC. Dual-mode template:

  - Base mode (helm install / OLM): <operator.name>-pvc-resize bound to the operator
    ServiceAccount across operator.watchNamespace.
  - Member mode (memberCluster.enabled=true, set exclusively by
    `kubectl mongodb multicluster generate-member-resources`):
    mck-member-pvc-resize bound to the member ServiceAccount
    mck-member-sa, additive to the base installation RBAC. The mck-member-*
    names are unified — identical on every member cluster.

Least-privilege verb set (list, watch, update): the operator only ever lists PVCs and
updates their requested storage during a resize. watch is required because the cached
client lazily starts a PVC informer on first list. PVC creation and deletion are
performed by the Kubernetes StatefulSet controller from volumeClaimTemplates (and its
retention policy), never by the operator.
*/ -}}
{{- $memberCluster := .Values.memberCluster | default dict -}}
{{- $memberMode := $memberCluster.enabled | default false -}}
{{- $operatorNamespace := include "mongodb-kubernetes-operator.namespace" . -}}

{{- $name := printf "%s-pvc-resize" .Values.operator.name -}}
{{- $bindingName := printf "%s-pvc-resize-binding" .Values.operator.name -}}
{{- $saName := .Values.operator.name -}}
{{- if $memberMode -}}
    {{- $memberPrefix := "mck-member" -}}
    {{- $name = printf "%s-pvc-resize" $memberPrefix -}}
    {{- $bindingName = printf "%s-pvc-resize-binding" $memberPrefix -}}
    {{- $saName = printf "%s-sa" $memberPrefix -}}
{{- end -}}

{{- $watchNamespace := list $operatorNamespace -}}
{{- if $memberMode -}}
    {{- /* Member mode: bound in memberCluster.workloadNamespaces plus the operator namespace;
           "*" is rejected — cluster-wide permission is expressed only via
           memberCluster.clusterScoped, which renders a single ClusterRoleBinding. */ -}}
    {{- $workloadNamespaces := $memberCluster.workloadNamespaces | default (list $operatorNamespace) -}}
    {{- $watchNamespace = concat $workloadNamespaces (list $operatorNamespace) | uniq -}}
    {{- if $memberCluster.clusterScoped | default false -}}
        {{- $watchNamespace = list "*" -}}
    {{- end -}}
{{- else if .Values.operator.watchNamespace -}}
    {{- $watchNamespace = regexSplit "," .Values.operator.watchNamespace -1 -}}
    {{- $watchNamespace = concat $watchNamespace (include "mongodb-kubernetes-operator.namespace" . | list) | uniq -}}
{{- end -}}


{{- /* One Role per watched namespace: only a cluster-wide watch ("*") renders a ClusterRole. */ -}}
{{- $roleScope := "Role" -}}
{{- if has "*" $watchNamespace -}}
    {{- $roleScope = "ClusterRole" -}}
    {{- $watchNamespace = list "*" -}}
{{- end -}}

{{- range $idx, $namespace := $watchNamespace }}
---
kind: {{ $roleScope }}
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $name }}
{{- if eq $roleScope "Role" }}
  namespace: {{ $namespace }}
{{- end }}
  annotations:
    mongodb.com/rbac-version: {{ $.Chart.Version | quote }}
rules:
  - apiGroups:
      - ''
    resources:
      - persistentvolumeclaims
    verbs:
      - list
      - watch
      - update
---
kind: {{ $roleScope }}Binding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $bindingName }}
{{- if eq $roleScope "Role" }}
  namespace: {{ $namespace }}
{{- end }}
  annotations:
    mongodb.com/rbac-version: {{ $.Chart.Version | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $roleScope }}
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ include "mongodb-kubernetes-operator.namespace" $ }}
{{- end }}
