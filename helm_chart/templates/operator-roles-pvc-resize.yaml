{{- /*
Template used directly by Helm and by kubectl plugin when rendering RBAC for member clusters.
*/ -}}

{{- $memberCluster := .Values.memberCluster | default dict -}}
{{- $memberMode := $memberCluster.enabled | default false -}}
{{- $operatorNamespace := include "mongodb-kubernetes-operator.namespace" . -}}

{{- $name := printf "%s-pvc-resize" .Values.operator.name -}}
{{- $bindingName := printf "%s-pvc-resize-binding" .Values.operator.name -}}
{{- $saName := .Values.operator.name -}}
{{- if $memberMode -}}
    {{- /*
    In member mode, change resource names. Member RBAC must never
    override RBAC from base installation (usually managed by Helm or OLM).
    */ -}}
    {{- $memberPrefix := "mck-member" -}}
    {{- $name = printf "%s-pvc-resize" $memberPrefix -}}
    {{- $bindingName = printf "%s-pvc-resize-binding" $memberPrefix -}}
    {{- $saName = printf "%s-sa" $memberPrefix -}}
{{- end -}}

{{- $watchNamespace := list $operatorNamespace -}}
{{- if .Values.operator.watchNamespace -}}
    {{- $watchNamespace = regexSplit "," .Values.operator.watchNamespace -1 -}}
    {{- $watchNamespace = concat $watchNamespace (list $operatorNamespace) | uniq -}}
{{- end -}}
{{- if $memberMode -}}
    {{- /*
    In member mode the member SA is bound in memberCluster.workloadNamespaces plus the
    operator namespace (which holds the SA and the token Secret).
    */ -}}
    {{- $workloadNamespaces := $memberCluster.workloadNamespaces | default (list $operatorNamespace) -}}
    {{- $watchNamespace = concat $workloadNamespaces (list $operatorNamespace) | uniq -}}

    {{- if $memberCluster.clusterScoped | default false -}}
        {{- $watchNamespace = list "*" -}}
    {{- end -}}
{{- end -}}


{{- /* One Role per watched namespace: only a cluster-wide watch ("*") renders a ClusterRole. */ -}}
{{- $roleScope := "Role" -}}
{{- if has "*" $watchNamespace -}}
    {{- $roleScope = "ClusterRole" -}}
    {{- $watchNamespace = list "*" -}}
{{- end -}}

{{- range $idx, $namespace := $watchNamespace }}
---
kind: {{ $roleScope }}
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $name }}
{{- if eq $roleScope "Role" }}
  namespace: {{ $namespace }}
{{- end }}
  annotations:
    mongodb.com/rbac-version: {{ $.Chart.Version | quote }}
rules:
  - apiGroups:
      - ''
    resources:
      - persistentvolumeclaims
    verbs:
      - list
      - watch
      - update
---
kind: {{ $roleScope }}Binding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $bindingName }}
{{- if eq $roleScope "Role" }}
  namespace: {{ $namespace }}
{{- end }}
  annotations:
    mongodb.com/rbac-version: {{ $.Chart.Version | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $roleScope }}
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $operatorNamespace }}
{{- end }}
