include:
  - filename: .evergreen-functions.yml
  - filename: .evergreen-tasks.yml

variables:
  - &setup_group
    setup_group_can_fail_task: true
    setup_group:
      - func: clone
      - func: setup_docker_sbom
      - func: download_kube_tools
      - func: setup_building_host
      - func: quay_login
      - func: switch_context

tasks:
  - name: periodic_teardown_aws
    commands:
      - func: cleanup_aws

  - name: periodic_teardown_cloudqa
    commands:
      - func: teardown_cloud_qa_all

  - name: periodic_gcp_cleanup
    commands:
      - func: clone
      - func: setup_gcloud_cli
      - command: subprocess.exec
        params:
          working_dir: src/github.com/mongodb/mongodb-kubernetes
          add_to_path:
            - ${workdir}/google-cloud-sdk/bin
          binary: scripts/evergreen/periodic-cleanup-gcp.sh
          env:
            MDB_GKE_PROJECT: "scratch-kubernetes-team"

task_groups:
  - name: periodic_teardown_task_group
    <<: *setup_group
    tasks:
      - periodic_teardown_aws
      - periodic_teardown_cloudqa
      - periodic_gcp_cleanup

buildvariants:
  - name: periodic_teardown
    display_name: periodic_teardown
    tags: [ "periodic_teardown" ]
    run_on:
      - ubuntu2204-small
    tasks:
      - name: periodic_teardown_task_group
