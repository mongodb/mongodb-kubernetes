include:
  - filename: .evergreen-functions.yml
  - filename: .evergreen-tasks.yml

variables:
  - &setup_group
    setup_group_can_fail_task: true
    setup_group:
      - func: clone
      - func: setup_docker_sbom
      - func: download_kube_tools
      - func: setup_building_host
      - func: quay_login
      - func: switch_context

tasks:
  - name: periodic_teardown_aws
    commands:
      - func: cleanup_aws

  - name: periodic_teardown_cloudqa
    commands:
      - func: teardown_cloud_qa_all

  - name: periodic_gcp_cleanup
    commands:
      # No task-level `clone`: it re-clones the workspace (git clean -fdx)
      # and would wipe the venv and context files created by the group setup.
      - command: subprocess.exec
        params:
          working_dir: src/github.com/mongodb/mongodb-kubernetes
          # The reaper uses the GCP client libraries, not the gcloud CLI, so
          # it only needs the service-account credentials expansion.
          include_expansions_in_env:
            - GCP_SERVICE_ACCOUNT_JSON_FOR_SNIPPETS_TESTS
          binary: scripts/dev/run_python.sh
          args:
            - scripts/evergreen/periodic_cleanup_gcp.py
          env:
            MDB_GKE_PROJECT: "scratch-kubernetes-team"
            # Patches can dry-run the reaper with
            #   --param gcp_cleanup_dry_run=true
            # and/or exercise a different age threshold with
            #   --param gcp_cleanup_age_threshold_hours=1
            DRY_RUN: ${gcp_cleanup_dry_run|false}
            AGE_THRESHOLD_HOURS: ${gcp_cleanup_age_threshold_hours|24}

task_groups:
  - name: periodic_teardown_task_group
    <<: *setup_group
    tasks:
      - periodic_teardown_aws
      - periodic_teardown_cloudqa
      - periodic_gcp_cleanup

buildvariants:
  - name: periodic_teardown
    display_name: periodic_teardown
    tags: [ "periodic_teardown" ]
    run_on:
      - ubuntu2204-small
    tasks:
      - name: periodic_teardown_task_group
