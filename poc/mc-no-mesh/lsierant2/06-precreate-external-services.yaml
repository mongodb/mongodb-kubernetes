apiVersion: v1
kind: Service
metadata:
  name: mdb-0-0-svc-external
  namespace: __NAMESPACE__
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
    - name: backup
      port: 27018
      targetPort: 27018
---
