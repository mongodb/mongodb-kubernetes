apiVersion: v1
kind: Service
metadata:
  name: mc-no-mesh-dns
  namespace: __NAMESPACE__
spec:
  selector:
    app: mc-no-mesh-relay
  ports:
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: 5353
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 5353
