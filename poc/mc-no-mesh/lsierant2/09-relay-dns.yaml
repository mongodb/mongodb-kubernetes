apiVersion: v1
kind: ConfigMap
metadata:
  name: mc-no-mesh-relay
  namespace: __NAMESPACE__
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: mongodb
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 27017
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: mongodb
                    cluster: remote_router
      clusters:
        - name: remote_router
          connect_timeout: 10s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: remote_router
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: __REMOTE_ROUTER_HOST__
                          port_value: 443
  Corefile: |
    .:5353 {
      errors
      health :8080
      ready :8181
      hosts /etc/relay/hosts {
        ttl 5
        reload 2s
        fallthrough
      }
      forward . /etc/resolv.conf
      cache 30
    }
  hosts: |
    __MDB_0_0_IP__ mdb-0-0.__CLUSTER0_DOMAIN__
    __MDB_1_0_IP__ mdb-1-0.__CLUSTER1_DOMAIN__
    __MDB_1_1_IP__ mdb-1-1.__CLUSTER1_DOMAIN__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-no-mesh-relay
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mc-no-mesh-relay
  template:
    metadata:
      annotations:
        mc-no-mesh/router-host: __REMOTE_ROUTER_HOST__
        mc-no-mesh/config-hash: __CONFIG_HASH__
      labels:
        app: mc-no-mesh-relay
    spec:
      imagePullSecrets:
        - name: __IMAGE_PULL_SECRET__
      containers:
        - name: envoy
          image: docker.io/envoyproxy/envoy:v1.37-latest
          args: ["-c", "/etc/relay/envoy.yaml", "--log-level", "info"]
          ports:
            - name: mongodb
              containerPort: 27017
          readinessProbe:
            tcpSocket:
              port: mongodb
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/relay
              readOnly: true
        - name: coredns
          image: __COREDNS_IMAGE__
          command: ["coredns"]
          args: ["-conf", "/etc/relay/Corefile"]
          ports:
            - name: dns-udp
              protocol: UDP
              containerPort: 5353
            - name: dns-tcp
              protocol: TCP
              containerPort: 5353
            - name: ready
              containerPort: 8181
          readinessProbe:
            tcpSocket:
              port: ready
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/relay
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mc-no-mesh-relay
