# This is a publish-only release process: it publishes images promoted
# for the tagged commit without rebuilding or retesting them. The pipeline
# performs preflight and RH certification, OpenShift bundle and RH branch work,
# post-release snippet generation, chart and plugin releases, and GitHub
# release-info publication.
include:
  - filename: .evergreen-functions.yml

tasks:
  - name: mckci_release_publish_images
    allowed_requesters: [ "patch", "github_tag" ]
    commands:
      - func: clone
      - func: setup_building_host
      - command: subprocess.exec
        type: test
        params:
          working_dir: src/github.com/mongodb/mongodb-kubernetes
          add_expansions_to_env: true
          binary: bash
          args:
            - scripts/evergreen/publish_images.sh

  - name: prepare_and_upload_openshift_bundles
    tags: [ "openshift_bundles" ]
    allowed_requesters: [ "patch", "github_tag" ]
    commands:
      - func: clone
      - func: setup_aws
      - func: configure_docker_auth
      - func: setup_prepare_openshift_bundles
      - func: prepare_openshift_bundles
      - func: update_evergreen_expansions
      - func: upload_openshift_bundle
        vars:
          # mongoDbOperator expansion is added in update_evergreen_expansions func from release.json
          bundle_file_name: "mck-operator-certified-${mongodbOperator}.tgz"

  - name: run_conditionally_prepare_and_upload_openshift_bundles
    tags: [ "openshift_bundles" ]
    allowed_requesters: [ "patch", "github_tag" ]
    commands:
      - func: clone
      - func: run_task_conditionally
        vars:
          condition_script: scripts/evergreen/should_prepare_openshift_bundles.sh
          variant: prepare_openshift_bundles
          task: prepare_and_upload_openshift_bundles

  - name: publish_openshift_bundles_to_rh
    tags: [ "openshift_bundles" ]
    allowed_requesters: [ "patch", "github_tag" ]
    commands:
      - func: clone
      - func: setup_building_host
      - func: update_evergreen_expansions
      - func: publish_openshift_bundles_to_rh

  - name: release_kubectl_mongodb_plugin
    tags: [ "binary_release" ]
    allowed_requesters: [ "patch", "github_tag" ]
    commands:
      - func: clone
      - func: python_venv
      - func: install_macos_notarization_service
      - func: assume_devprod_platforms_ecr_role
      - func: write_devprod_platforms_ecr_aws_profile
      - func: release_kubectl_mongodb_plugin

  - name: add_releaseinfo_to_github_assets
    commands:
      - func: clone
      - func: python_venv
      - func: add_releaseinfo_to_github_assets

  - name: create_chart_release_pr
    tags: [ "helm_chart_release_pr" ]
    commands:
      - func: clone
      - func: python_venv
      - func: create_chart_release_pr

  - name: release_chart_to_oci_registry
    tags: [ "release_chart_to_oci_registry" ]
    commands:
      - func: clone
      - func: python_venv
      - func: setup_kubectl
      - func: setup_aws
      - func: publish_helm_chart

buildvariants:
  - name: release_publish
    display_name: release_publish
    tags: [ "release-publish" ]
    run_on:
      - release-ubuntu2404-small # This is required for CISA attestation https://jira.mongodb.org/browse/DEVPROD-17780
    allowed_requesters: [ "patch", "github_tag" ]
    tasks:
      - name: mckci_release_publish_images

  # Preflight/RH certification against the images just published to
  # quay.io/mongodb/*:{version}. No rebuild: preflight only reads existing images.
  - name: preflight_released_images
    display_name: preflight_released_images
    tags: [ "release-publish" ]
    run_on:
      - rhel90-large
    allowed_requesters: [ "patch", "github_tag" ]
    depends_on:
      - name: "*"
        variant: release_publish
    tasks:
      - name: preflight_release_operator_images_task_group

  # Prepares the OpenShift bundle for this version if it doesn't already
  # exist in S3 (see should_prepare_openshift_bundles.sh). No image rebuild:
  # reads the version from release.json.
  - name: prepare_openshift_bundles
    display_name: prepare_openshift_bundles
    tags: [ "release-publish" ]
    run_on:
      - ubuntu2404-small
    allowed_requesters: [ "patch", "github_tag" ]
    depends_on:
      - name: "*"
        variant: release_publish
      - name: "*"
        variant: preflight_released_images
    tasks:
      - name: run_conditionally_prepare_and_upload_openshift_bundles

  # Opens a PR against the Red Hat forks with the bundle prepared above. The
  # code only pushes branches to forks; the PR to Red Hat is manually created by the release operator.
  - name: prepare_openshift_bundles_to_rh
    display_name: prepare_openshift_bundles_to_rh
    tags: [ "release-publish" ]
    run_on:
      - ubuntu2404-small
    # Allowed on patches: only pushes to mongodb-forks; the Red Hat PR is manual.
    allowed_requesters: [ "patch", "github_tag" ]
    depends_on:
      - name: run_conditionally_prepare_and_upload_openshift_bundles
        variant: prepare_openshift_bundles
    tasks:
      - name: publish_openshift_bundles_to_rh

  # Public docs snippet generation against the already-published images.
  # Uses the same task groups as the manual public snippet variants
  # (.evergreen-snippets.yml) but wired into the release pipeline so that
  # the public docs are updated automatically once images are live.
  - name: release_kind_code_snippets
    display_name: release_kind_code_snippets
    tags: [ "release-publish" ]
    run_on:
      - ubuntu2404-large
    allowed_requesters: [ "patch", "github_tag" ]
    depends_on:
      - name: "*"
        variant: release_publish
      # Wait for the rest of the publishing pipeline to complete
      # before starting snippet generation (snippets are post-release).
      - name: "*"
        variant: release_chart_to_oci_registry
      - name: "*"
        variant: release_kubectl_mongodb_plugin
      - name: "*"
        variant: add_releaseinfo_to_github_assets
      - name: "*"
        variant: preflight_released_images
      - name: "*"
        variant: prepare_openshift_bundles_to_rh
      - name: "*"
        variant: create_chart_release_pr
    tasks:
      - name: kind_code_snippets_task_group

  - name: release_gke_code_snippets
    display_name: release_gke_code_snippets
    tags: [ "release-publish" ]
    run_on:
      - ubuntu2404-small
    allowed_requesters: [ "patch", "github_tag" ]
    depends_on:
      - name: "*"
        variant: release_publish
      # Wait for the rest of the publishing pipeline to complete
      # before starting snippet generation (snippets are post-release).
      - name: "*"
        variant: release_chart_to_oci_registry
      - name: "*"
        variant: release_kubectl_mongodb_plugin
      - name: "*"
        variant: add_releaseinfo_to_github_assets
      - name: "*"
        variant: preflight_released_images
      - name: "*"
        variant: prepare_openshift_bundles_to_rh
      - name: "*"
        variant: create_chart_release_pr
    tasks:
      - name: gke_code_snippets_task_group

  # File-copy + GitHub PR only; needs just the version string, no images.
  - name: create_chart_release_pr
    display_name: create_chart_release_pr
    tags: [ "release-publish" ]
    run_on:
      - release-ubuntu2404-small # This is required for CISA attestation https://jira.mongodb.org/browse/DEVPROD-17780
    allowed_requesters: [ "patch", "github_tag" ]
    tasks:
      - name: create_chart_release_pr

  # helm package + push to OCI; gated on release_publish so the chart never
  # references an operator image that hasn't been published yet.
  - name: release_chart_to_oci_registry
    display_name: release_chart_to_oci_registry
    tags: [ "release-publish" ]
    run_on:
      - release-ubuntu2404-small # This is required for CISA attestation https://jira.mongodb.org/browse/DEVPROD-17780
    allowed_requesters: [ "patch", "github_tag" ]
    depends_on:
      - name: "*"
        variant: release_publish
    tasks:
      - name: release_chart_to_oci_registry

  # Publishes/notarizes the kubectl-mongodb plugin binary; needs only the
  # version + already-published assets, no image rebuild.
  - name: release_kubectl_mongodb_plugin
    display_name: release_kubectl_mongodb_plugin
    tags: [ "release-publish" ]
    run_on:
      - release-ubuntu2404-small # This is required for CISA attestation https://jira.mongodb.org/browse/DEVPROD-17780
    allowed_requesters: [ "patch", "github_tag" ]
    # Must wait for images to be published before promoting kubectl plugin binaries.
    depends_on:
      - name: "*"
        variant: release_publish
    tasks:
      - name: release_kubectl_mongodb_plugin

  # Attaches release metadata to the GitHub release; version-only, no images.
  - name: add_releaseinfo_to_github_assets
    display_name: add_releaseinfo_to_github_assets
    tags: [ "release-publish" ]
    run_on:
      - ubuntu2404-small
    allowed_requesters: [ "patch", "github_tag" ]
    # Must wait for images to be published before recording release info.
    depends_on:
      - name: "*"
        variant: release_publish
    tasks:
      - name: add_releaseinfo_to_github_assets
