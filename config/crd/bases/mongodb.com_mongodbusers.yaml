---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: mongodbusers.mongodb.com
spec:
  group: mongodb.com
  names:
    kind: MongoDBUser
    listKind: MongoDBUserList
    plural: mongodbusers
    shortNames:
    - mdbu
    singular: mongodbuser
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The current state of the MongoDB User.
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: The time since the MongoDB User resource was created.
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              clientCertificate:
                description: |-
                  ClientCertificate requests the operator to issue an x509 client certificate for this user, for an
                  application to connect with. The referenced MongoDB resource must use operator-managed
                  certificates (spec.security.managedCertificate) and x509 authentication, and must be in the
                  same namespace as this user. The field's presence turns the request on, clientCertificate: {} uses
                  the defaults. The username is the minted certificate's subject, which the operator derives and reports
                  in status.username.
                properties:
                  subject:
                    description: |-
                      Subject of the requested certificate. The username is derived from it. Defaults:
                      commonName is the MongoDBUser name, organizations is <resource>-app-client and
                      organizationalUnits is the namespace. It must differ from the mongodb deployment's membership
                      subject in organizations or organizationalUnits, or mongod treats the user as a cluster member.
                    properties:
                      commonName:
                        type: string
                      organizationalUnits:
                        items:
                          type: string
                        type: array
                      organizations:
                        items:
                          type: string
                        type: array
                    type: object
                type: object
              connectionStringDatabase:
                description: |-
                  ConnectionStringDatabase is an optional database name for the connection string URI path
                  (e.g. .../myapp?...). When unset, the URI path is omitted and which database is used
                  depends on the connecting client.
                type: string
              connectionStringSecretName:
                type: string
              db:
                type: string
              mongodbResourceRef:
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              passwordSecretKeyRef:
                description: |-
                  SecretKeyRef is a reference to a value in a given secret in the same
                  namespace. Based on:
                  https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.15/#secretkeyselector-v1-core
                properties:
                  key:
                    type: string
                  name:
                    type: string
                required:
                - name
                type: object
              roles:
                items:
                  properties:
                    db:
                      type: string
                    name:
                      type: string
                  required:
                  - db
                  - name
                  type: object
                type: array
              username:
                description: |-
                  Username is the name of the user. When clientCertificate is requested it is the certificate subject,
                  for example CN=my-app,OU=my-namespace,O=my-rs-app-client. Leave it empty to have the operator
                  fill it in from the cert subject, or set it to that exact value.
                type: string
            required:
            - db
            type: object
            x-kubernetes-validations:
            - message: spec.username is required unless spec.clientCertificate is
                set
              rule: has(self.clientCertificate) || (has(self.username) && size(self.username)
                > 0)
            - message: 'spec.clientCertificate requires spec.db to be $external: the
                user authenticates with its x509 certificate'
              rule: '!has(self.clientCertificate) || self.db == ''$external'''
            - message: 'spec.clientCertificate and spec.passwordSecretKeyRef are mutually
                exclusive: the user authenticates with its x509 certificate'
              rule: '!has(self.clientCertificate) || !has(self.passwordSecretKeyRef)
                || !has(self.passwordSecretKeyRef.name) || size(self.passwordSecretKeyRef.name)
                == 0'
          status:
            properties:
              clientCertificate:
                description: |-
                  ClientCertificate tells an application where to find what it needs to connect, when
                  spec.clientCertificate is set.
                properties:
                  secretName:
                    description: SecretName is the kubernetes.io/tls Secret with the
                      client certificate and key (tls.crt, tls.key).
                    type: string
                  serverCAConfigMapName:
                    description: |-
                      ServerCAConfigMapName is the ConfigMap with the CA that verifies the deployment's server
                      certificates (key ca-pem). The operator keeps it up to date.
                    type: string
                required:
                - secretName
                - serverCAConfigMapName
                type: object
              db:
                type: string
              lastTransition:
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              project:
                type: string
              projectId:
                type: string
              pvc:
                items:
                  properties:
                    phase:
                      type: string
                    statefulsetName:
                      type: string
                  required:
                  - phase
                  - statefulsetName
                  type: object
                type: array
              resourcesNotReady:
                items:
                  description: ResourceNotReady describes the dependent resource which
                    is not ready yet
                  properties:
                    errors:
                      items:
                        properties:
                          message:
                            type: string
                          reason:
                            type: string
                        type: object
                      type: array
                    kind:
                      description: ResourceKind specifies a kind of a Kubernetes resource.
                        Used in status of a Custom Resource
                      type: string
                    message:
                      type: string
                    name:
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
              roles:
                items:
                  properties:
                    db:
                      type: string
                    name:
                      type: string
                  required:
                  - db
                  - name
                  type: object
                type: array
              username:
                type: string
              warnings:
                items:
                  type: string
                type: array
            required:
            - db
            - phase
            - project
            - username
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
