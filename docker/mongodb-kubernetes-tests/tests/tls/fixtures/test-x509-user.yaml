---
apiVersion: mongodb.com/v1
kind: MongoDBUser
metadata:
  name: test-x509-user
spec:
  username: 'CN=x509-testing-user'
  authSource: '$external'
  defaultDatabase: '$external'
  mongodbResourceRef:
    name: 'test-tls-base-rs-x509'
  roles:
    - db: "admin"
      name: "clusterAdmin"
    - db: "admin"
      name: "userAdminAnyDatabase"
    - db: "admin"
      name: "readWrite"
