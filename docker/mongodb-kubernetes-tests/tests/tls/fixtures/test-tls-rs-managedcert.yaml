---
apiVersion: mongodb.com/v1
kind: MongoDB
metadata:
  name: test-tls-rs-managedcert
spec:
  members: 3
  version: 8.0.3
  type: ReplicaSet
  opsManager:
    configMapRef:
      name: my-project
  credentials: my-credentials
  logLevel: DEBUG

  persistent: true
  security:
    tls:
      enabled: true
    authentication:
      enabled: true
      modes:
      - X509
      internalCluster: X509
