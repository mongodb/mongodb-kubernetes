---
apiVersion: mongodb.com/v1
kind: MongoDBUser
metadata:
  name: mms-user-2
spec:
  passwordSecretKeyRef:
    name: mms-user-2-password
    key: password
  username: "mms-user-2"
  authSource: "testdb"
  defaultDatabase: "testdb"
  mongodbResourceRef:
    name: "my-replica-set"
  roles:
    - db: "testdb"
      name: "readWrite"
