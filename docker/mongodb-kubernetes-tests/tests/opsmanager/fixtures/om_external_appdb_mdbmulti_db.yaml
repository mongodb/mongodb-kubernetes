---
apiVersion: mongodb.com/v1
kind: MongoDBMultiCluster
metadata:
  name: om-external-appdb-db
spec:
  version: 4.4.20-ent
  type: ReplicaSet
  duplicateServiceObjects: false
  role: AppDB
  opsManager:
    configMapRef:
      name: om-external-appdb-db-config
  credentials: my-credentials
  persistent: true
  security:
    authentication:
      enabled: true
      modes:
        - SCRAM
      ignoreUnknownUsers: true
  clusterSpecList:
    - clusterName: kind-e2e-cluster-1
      members: 1
    - clusterName: kind-e2e-cluster-2
      members: 1
    - clusterName: kind-e2e-cluster-3
      members: 1
